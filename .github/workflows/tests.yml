name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep macOS coverage on Intel while the hosted ARM pool is capacity-constrained.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version
          else
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
      - name: FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python -m pip install ".[dev]"
      - run: framecheck doctor
      - run: python -m ruff check src tests examples
      - run: python -m pytest -q
      - run: python -m build
